<html lang="en">

<body>
    <div class="main">
      <div class="formBox">
         <form action="">
            <h2>Login</h2>
           <div class="inputBox">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" required>
            <label for="">UserName</label>
           </div>
           <div class="inputBox">
            <i class="fa-solid fa-lock"></i>
            <input type="password" required>
            <label for="">Password</label>
           </div>
           <div class="remember">
            <label for="Login"> <input type="text">Remeber Me <a href="">Forget Password</a></label>
           </div>
           <button>Login</button>
           <div class="Register">
            <p>Dont have a account <a href="#">Register</a></p>
           </div>
         </form>
      </div>
    </div>
</body>
